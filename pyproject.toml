[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeopsy"
version = "0.2.0"
description = "A股交割单交易行为归因：FIFO 配对账本 + Odean 1998 处置效应口径"
readme = "README.md"
requires-python = ">=3.10"
# 刻意保持零第三方依赖。理由：
#   1. 用户本地 pip install 时不该被拖进 akshare 那一大坨
#   2. GitHub Actions 每次装包都从零开始，依赖越少成功率越高
#   3. 所有金融计算用 Decimal，标准库就够
dependencies = []

# 可选：只有 tools/fetch_prices.py 拉行情时需要，核心与测试都不依赖它。
#     pip install -e ".[fetch]"
[project.optional-dependencies]
fetch = ["akshare>=1.16"]

[project.scripts]
tradeopsy = "tradeopsy.__main__:main"
tradeopsy-paper = "tradeopsy.paper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradeopsy = ["data/*.json"]
